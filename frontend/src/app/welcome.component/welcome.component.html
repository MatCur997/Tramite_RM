<div class="page welcome" (click)="start()" [attr.dir]="state.dir()" [attr.lang]="state.selectedLanguage() ?? 'it'">
  <app-top-controls [withBack]="false" (language)="openLanguage()" />

  <div class="center">
    <!-- The white wordmark: the full logo has a tagline and greetings of its own, in other languages. -->
    <img class="logo" src="logo-tramite-wordmark-negativo.png" alt="Tramite – Sportello digitale multilingue" />
    <p class="subtitle">{{ state.t('welcomeSubtitle') }}</p>

    <button type="button" class="cta">
      <i class="fa-solid fa-hand-pointer" aria-hidden="true"></i>
      <span>{{ tapText() }}</span>
    </button>

    <!-- "Welcome" in the other languages of the kiosk: the language can be changed. -->
    <p class="hellos">
      @for (hello of hellos(); track hello.code) {
        <span [attr.lang]="hello.code" [attr.dir]="hello.code === 'ar' ? 'rtl' : null">{{ hello.text }}</span>
      }
    </p>
  </div>
</div>
