<div class="page" [class.rtl]="state.isRtl()" [attr.dir]="state.dir()" [attr.lang]="state.selectedLanguage()">
  <app-top-controls (back)="goBack()" (language)="goToLanguageSelection()" />

  <div class="choice-main">
    <h1 class="choice-title">{{ state.t('choicePrompt') }}</h1>

    <div class="choice-cards">
      <button class="choice-card choice-assistant" (click)="openAssistant()" type="button">
        <span class="art" aria-hidden="true">
          <!-- A form with a speech bubble above it. -->
          <svg viewBox="0 0 120 120" width="120" height="120">
            <rect x="22" y="36" width="56" height="70" rx="7" fill="#ffffff" stroke="currentColor" stroke-width="5" />
            <path d="M33 56h34M33 69h34M33 82h22" stroke="currentColor" stroke-width="5" stroke-linecap="round" />
            <path d="M62 12h42a9 9 0 0 1 9 9v24a9 9 0 0 1-9 9H86l-12 11V54H62a9 9 0 0 1-9-9V21a9 9 0 0 1 9-9z" fill="currentColor" />
            <circle cx="72" cy="33" r="4" fill="#ffffff" />
            <circle cx="83" cy="33" r="4" fill="#ffffff" />
            <circle cx="94" cy="33" r="4" fill="#ffffff" />
          </svg>
        </span>
        <span class="card-title">{{ state.t('optAssistant') }}</span>
        <span class="card-desc">{{ state.t('optAssistantDesc') }}</span>
        <span class="pill">
          <span>{{ state.t('optStart') }}</span>
          <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
        </span>
      </button>

      <button class="choice-card choice-offices" (click)="openOffices()" type="button">
        <span class="art" aria-hidden="true">
          <!-- A folded map with a pin on it. -->
          <svg viewBox="0 0 120 120" width="120" height="120">
            <path d="M12 42l30-11 36 11 30-11v64l-30 11-36-11-30 11z" fill="#ffffff" stroke="currentColor" stroke-width="5" stroke-linejoin="round" />
            <path d="M42 31v64M78 42v64" stroke="currentColor" stroke-width="5" />
            <path d="M78 12c-12 0-21 9-21 20 0 15 21 36 21 36s21-21 21-36c0-11-9-20-21-20z" fill="currentColor" />
            <circle cx="78" cy="32" r="8" fill="#ffffff" />
          </svg>
        </span>
        <span class="card-title">{{ state.t('optOffices') }}</span>
        <span class="card-desc">{{ state.t('optOfficesDesc') }}</span>
        <span class="pill">
          <span>{{ state.t('optSearch') }}</span>
          <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
        </span>
      </button>
    </div>
  </div>
</div>
