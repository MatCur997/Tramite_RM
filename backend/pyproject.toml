[project]
name = "totem-backend"
version = "0.1.0"
description = "RAG backend of the Totem kiosk for the Roma Capitale registry office"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "numpy>=2.0",
    "pydantic-settings>=2.4",
    "pypdf>=5.0",
    "trafilatura>=2.0",
    "pyserial>=3.5",
    "pillow>=13.0.0",
    "faster-whisper>=1.1",
    # sherpa-onnx 2 no longer turns text into phonemes by itself for the Piper voices.
    "sherpa-onnx>=1.12,<2",
    # Its shared libraries, onnxruntime included. uv missed this dependency of sherpa-onnx: without it
    # Windows loads the older onnxruntime.dll in System32 and the process crashes.
    "sherpa-onnx-core>=1.12,<2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
